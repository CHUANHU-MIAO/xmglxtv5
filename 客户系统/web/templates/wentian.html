<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>问天 · 东方术数</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<script src="/static/js/lunar/lunar.js"></script>
<script src="/static/js/iztro/iztro.min.js"></script>
<style>
:root{
  --bg-deep:#070b14;
  --bg-mid:#0d1526;
  --bg-card:rgba(20,30,52,.75);
  --bg-card-hover:rgba(28,40,68,.9);
  
  --gold:#d4af37;
  --gold-light:#f0d77a;
  --gold-dark:#9a7b2a;
  --gold-glow:rgba(212,175,55,.25);
  
  --jade:#4ecdc4;
  --jade-light:#7de8e0;
  --jade-glow:rgba(78,205,196,.2);
  
  --text-primary:#e8e6e3;
  --text-secondary:#a8a29e;
  --text-muted:#6b6660;
  
  --border-gold:rgba(212,175,55,.18);
  --border-jade:rgba(78,205,196,.15);
  
  --font:'Noto Serif SC',serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-deep);color:var(--text-primary);font-family:var(--font);font-size:15px}

/* 背景星云 */
#nebula{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 50% at 20% 10%,rgba(212,175,55,.06),transparent),
    radial-gradient(ellipse 60% 40% at 80% 80%,rgba(78,205,196,.05),transparent),
    radial-gradient(ellipse 100% 100% at 50% 50%,rgba(13,21,38,1),transparent)
}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--dur,3s) ease-in-out infinite alternate}
@keyframes twinkle{0%{opacity:.1;transform:scale(.5)}100%{opacity:.6;transform:scale(1)}}

#app{position:relative;z-index:1;width:100%;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}

/* 顶部标题 */
.header{padding:20px 0 14px;text-align:center;flex-shrink:0;
  background:linear-gradient(180deg,rgba(7,11,20,.98),transparent)}
.header h1{font-size:26px;font-weight:900;letter-spacing:12px;
  background:linear-gradient(135deg,var(--gold-light),var(--gold),var(--jade));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 20px var(--gold-glow))}
.header .sub{font-size:10px;color:var(--text-muted);letter-spacing:5px;margin-top:4px}

/* 主内容区 */
.page-wrap{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;overflow-y:auto;padding:4px 16px 20px;
  opacity:0;transform:translateY(10px);transition:all .35s cubic-bezier(.4,0,.2,1);pointer-events:none}
.page.active{opacity:1;transform:translateY(0);pointer-events:auto}
.page::-webkit-scrollbar{width:3px}
.page::-webkit-scrollbar-thumb{background:var(--gold);border-radius:2px}

/* 子tab */
.sub-tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.sub-tabs::-webkit-scrollbar{display:none}
.sub-tab{padding:7px 16px;background:var(--bg-card);border:1px solid var(--border-gold);
  border-radius:20px;color:var(--text-secondary);font-size:13px;white-space:nowrap;
  cursor:pointer;transition:all .3s;flex-shrink:0}
.sub-tab.active{background:linear-gradient(135deg,rgba(212,175,55,.2),rgba(212,175,55,.08));
  border-color:var(--gold);color:var(--gold-light);box-shadow:0 0 15px var(--gold-glow)}
.sub-tab:active{transform:scale(.95)}

/* 卡片 */
.card{background:var(--bg-card);backdrop-filter:blur(12px);
  border:1px solid var(--border-gold);border-radius:16px;padding:18px;margin-bottom:14px;
  box-shadow:0 4px 24px rgba(0,0,0,.3);transition:all .3s}
.card-title{font-size:15px;font-weight:600;color:var(--gold-light);margin-bottom:14px;
  display:flex;align-items:center;gap:8px}
.card-title::before{content:'';width:3px;height:16px;background:linear-gradient(180deg,var(--gold),var(--jade));border-radius:2px}

/* 快速入口网格 */
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
.quick-item{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--bg-card);border:1px solid var(--border-gold);border-radius:16px;cursor:pointer;
  transition:all .3s}
.quick-item:active{transform:scale(.93);background:var(--bg-card-hover)}
.quick-icon{font-size:28px;margin-bottom:6px}
.quick-label{font-size:11px;color:var(--text-secondary)}

/* 按钮 */
.btn{display:block;width:100%;padding:13px;border:none;border-radius:12px;
  background:linear-gradient(135deg,var(--gold-dark),var(--gold));color:#000;
  font-family:var(--font);font-size:15px;font-weight:600;letter-spacing:4px;
  cursor:pointer;transition:all .3s;box-shadow:0 4px 20px var(--gold-glow)}
.btn:active{transform:scale(.98);box-shadow:0 2px 10px var(--gold-glow)}
.btn-ghost{background:transparent;border:1px solid var(--border-gold);color:var(--gold)}

/* 输入框 */
.input-group{margin-bottom:14px}
.input-group label{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:6px}
.input-group input,.input-group select{width:100%;padding:11px 14px;background:rgba(0,0,0,.2);
  border:1px solid var(--border-gold);border-radius:10px;color:var(--text-primary);
  font-family:var(--font);font-size:14px;outline:none;transition:all .3s}
.input-group input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow)}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* 结果展示 */
.result-box{background:rgba(0,0,0,.2);border:1px solid var(--border-jade);border-radius:12px;
  padding:16px;margin-top:14px;line-height:1.9;font-size:13px;color:var(--text-secondary)}
.result-box .highlight{color:var(--gold-light);font-weight:600}

/* 底部导航 */
.tab-bar{display:flex;background:rgba(7,11,20,.95);border-top:1px solid var(--border-gold);
  padding:6px 0 calc(6px + env(safe-area-inset-bottom));flex-shrink:0;position:relative}
.tab-bar::before{content:'';position:absolute;top:0;left:10%;right:10%;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),var(--jade),transparent)}
.tab-item{flex:1;text-align:center;cursor:pointer;padding:4px 0;transition:all .3s;position:relative}
.tab-icon{font-size:22px;display:block;opacity:.4;transition:all .3s;filter:grayscale(.8)}
.tab-label{font-size:10px;color:var(--text-muted);transition:all .3s;letter-spacing:1px}
.tab-item.active .tab-icon{opacity:1;filter:grayscale(0);transform:translateY(-2px)}
.tab-item.active .tab-label{color:var(--gold)}
.tab-item.active::after{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  width:6px;height:6px;background:var(--gold);border-radius:50%;box-shadow:0 0 10px var(--gold)}

/* 紫微斗数盘 */
.ziwei-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:12px 0}
.ziwei-palace{aspect-ratio:1;background:rgba(0,0,0,.25);border:1px solid var(--border-gold);
  border-radius:6px;padding:4px;font-size:9px;line-height:1.4;position:relative;overflow:hidden}
.ziwei-palace .palace-name{color:var(--text-muted);font-size:8px;text-align:right}
.ziwei-palace .main-star{color:var(--gold-light);font-weight:600}
.ziwei-palace .minor-star{color:var(--jade-light)}
.ziwei-palace.has-zhu{border-color:var(--gold);box-shadow:inset 0 0 12px rgba(212,175,55,.1)}

/* 六爻卦象 */
.gua-line{height:12px;margin:3px auto;width:80px;display:flex;justify-content:space-between}
.gua-line.yang{background:var(--gold);border-radius:2px}
.gua-line.yin{background:transparent;position:relative}
.gua-line.yin::before,.gua-line.yin::after{content:'';position:absolute;top:0;width:45%;height:100%;background:var(--gold);border-radius:2px}
.gua-line.yin::before{left:0}
.gua-line.yin::after{right:0}

/* 民俗条目 */
.folk-item{padding:12px;border-bottom:1px solid var(--border-gold);display:flex;justify-content:space-between;align-items:center}
.folk-item:last-child{border-bottom:none}
.folk-time{color:var(--gold-light);font-size:13px}
.folk-desc{color:var(--text-secondary);font-size:12px;text-align:right}

/* 黄道吉日 */
.almanac-day{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-gold)}
.almanac-date{font-size:13px}
.almanac-yi{color:var(--jade)}
.almanac-ji{color:#e88}

@media(min-width:768px){
  body{font-size:16px}
  .tab-icon{font-size:26px}
  .tab-label{font-size:12px}
  .sub-tab{padding:8px 18px;font-size:14px}
}
</style>
</head>
<body>
<div id="nebula"></div>
<div id="stars"></div>

<div id="app">
  <div class="header">
    <h1>问天</h1>
    <div class="sub">天 人 合 德 · 易 道 无 穷</div>
  </div>

  <div class="page-wrap">
    <!-- 首页 -->
    <div class="page active" id="page-home">
      <div class="card">
        <div class="card-title">今日黄历</div>
        <div id="todayAlmanac" style="font-size:13px;line-height:2;color:var(--text-secondary)">加载中...</div>
      </div>
      <div class="card">
        <div class="card-title">快速起卦</div>
        <div class="quick-grid">
          <div class="quick-item" onclick="switchTab(1);switchSub('coin')">
            <span class="quick-icon">🪙</span><span class="quick-label">金钱卦</span>
          </div>
          <div class="quick-item" onclick="switchTab(1);switchSub('liuyao')">
            <span class="quick-icon">☰</span><span class="quick-label">六爻</span>
          </div>
          <div class="quick-item" onclick="switchTab(1);switchSub('ziwei')">
            <span class="quick-icon">⭐</span><span class="quick-label">紫微斗数</span>
          </div>
          <div class="quick-item" onclick="switchTab(1);switchSub('meihua')">
            <span class="quick-icon">🌸</span><span class="quick-label">梅花易数</span>
          </div>
          <div class="quick-item" onclick="switchTab(2)">
            <span class="quick-icon">👂</span><span class="quick-label">民俗</span>
          </div>
          <div class="quick-item" onclick="switchTab(3)">
            <span class="quick-icon">📅</span><span class="quick-label">黄历</span>
          </div>
          <div class="quick-item" onclick="switchTab(1);switchSub('liuren')">
            <span class="quick-icon">🌊</span><span class="quick-label">大六壬</span>
          </div>
          <div class="quick-item" onclick="switchTab(1);switchSub('xiaoliuren')">
            <span class="quick-icon">🐎</span><span class="quick-label">小六壬</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 占卜 -->
    <div class="page" id="page-duk">
      <div class="sub-tabs">
        <div class="sub-tab active" data-sub="coin" onclick="switchSub('coin')">金钱卦</div>
        <div class="sub-tab" data-sub="liuyao" onclick="switchSub('liuyao')">六爻</div>
        <div class="sub-tab" data-sub="ziwei" onclick="switchSub('ziwei')">紫微斗数</div>
        <div class="sub-tab" data-sub="meihua" onclick="switchSub('meihua')">梅花易数</div>
        <div class="sub-tab" data-sub="liuren" onclick="switchSub('liuren')">大六壬</div>
        <div class="sub-tab" data-sub="xiaoliuren" onclick="switchSub('xiaoliuren')">小六壬</div>
      </div>

      <!-- 金钱卦 -->
      <div class="sub-page" id="sub-coin">
        <div class="card">
          <div class="card-title">金钱卦摇卦</div>
          <p style="font-size:12px;color:var(--text-muted);margin-bottom:14px">心中默想要问之事，点击下方按钮摇六次</p>
          <div id="coinResult" style="text-align:center;padding:20px 0">
            <div style="font-size:48px;margin-bottom:16px">🪙</div>
            <p style="font-size:12px;color:var(--text-secondary)">已摇 0 / 6 次</p>
          </div>
          <button class="btn" onclick="shakeCoin()" style="margin-top:16px">摇 卦</button>
        </div>
      </div>

      <!-- 六爻排盘 -->
      <div class="sub-page" id="sub-liuyao" style="display:none">
        <div class="card">
          <div class="card-title">六爻排盘</div>
          <div class="input-group">
            <label>出生年月日时</label>
            <input type="datetime-local" id="liuyaoBirth">
          </div>
          <button class="btn" onclick="castLiuyao()">排 盘</button>
          <div id="liuyaoResult"></div>
        </div>
      </div>

      <!-- 紫微斗数 -->
      <div class="sub-page" id="sub-ziwei" style="display:none">
        <div class="card">
          <div class="card-title">紫微斗数排盘</div>
          <div class="row-2">
            <div class="input-group">
              <label>公历生日</label>
              <input type="date" id="ziweiBirth" value="2000-01-01">
            </div>
            <div class="input-group">
              <label>出生时间</label>
              <select id="ziweiTime">
                <option value="0">子时 (23-1)</option>
                <option value="1">丑时 (1-3)</option>
                <option value="2">寅时 (3-5)</option>
                <option value="3">卯时 (5-7)</option>
                <option value="4">辰时 (7-9)</option>
                <option value="5">巳时 (9-11)</option>
                <option value="6">午时 (11-13)</option>
                <option value="7">未时 (13-15)</option>
                <option value="8">申时 (15-17)</option>
                <option value="9">酉时 (17-19)</option>
                <option value="10">戌时 (19-21)</option>
                <option value="11">亥时 (21-23)</option>
              </select>
            </div>
          </div>
          <div class="input-group">
            <label>性别</label>
            <select id="ziweiGender">
              <option value="male">男</option>
              <option value="female">女</option>
            </select>
          </div>
          <button class="btn" onclick="castZiwei()">排 盘</button>
          <div id="ziweiResult"></div>
        </div>
      </div>

      <!-- 梅花易数 -->
      <div class="sub-page" id="sub-meihua" style="display:none">
        <div class="card">
          <div class="card-title">梅花易数</div>
          <div class="input-group">
            <label>随意报两个数</label>
            <div class="row-2">
              <input type="number" id="meiNum1" placeholder="第一个数" min="1" max="99">
              <input type="number" id="meiNum2" placeholder="第二个数" min="1" max="99">
            </div>
          </div>
          <button class="btn" onclick="castMeihua()">起 卦</button>
          <div id="meihuaResult"></div>
        </div>
      </div>

      <!-- 大六壬 -->
      <div class="sub-page" id="sub-liuren" style="display:none">
        <div class="card">
          <div class="card-title">大六壬</div>
          <p style="font-size:12px;color:var(--text-muted);margin-bottom:14px">根据当前时间起课</p>
          <button class="btn" onclick="castLiuren()">起 课</button>
          <div id="liurenResult"></div>
        </div>
      </div>

      <!-- 小六壬 -->
      <div class="sub-page" id="sub-xiaoliuren" style="display:none">
        <div class="card">
          <div class="card-title">小六壬 · 诸葛马前课</div>
          <div class="input-group">
            <label>农历月份</label>
            <select id="xlrMonth">
              <option value="1">正月</option><option value="2">二月</option><option value="3">三月</option>
              <option value="4">四月</option><option value="5">五月</option><option value="6">六月</option>
              <option value="7">七月</option><option value="8">八月</option><option value="9">九月</option>
              <option value="10">十月</option><option value="11">冬月</option><option value="12">腊月</option>
            </select>
          </div>
          <div class="row-2">
            <div class="input-group">
              <label>农历日</label>
              <input type="number" id="xlrDay" min="1" max="30" value="15">
            </div>
            <div class="input-group">
              <label>时辰</label>
              <select id="xlrHour">
                <option value="0">子时</option><option value="1">丑时</option><option value="2">寅时</option>
                <option value="3">卯时</option><option value="4">辰时</option><option value="5">巳时</option>
                <option value="6">午时</option><option value="7">未时</option><option value="8">申时</option>
                <option value="9">酉时</option><option value="10">戌时</option><option value="11">亥时</option>
              </select>
            </div>
          </div>
          <button class="btn" onclick="castXiaoliuren()">占 卜</button>
          <div id="xlrResult"></div>
        </div>
      </div>
    </div>

    <!-- 民俗预测 -->
    <div class="page" id="page-folk">
      <div class="sub-tabs">
        <div class="sub-tab active" data-folk="ear" onclick="switchFolk('ear')">耳鸣</div>
        <div class="sub-tab" data-folk="eye" onclick="switchFolk('eye')">眼跳</div>
        <div class="sub-tab" data-folk="sneeze" onclick="switchFolk('sneeze')">喷嚏</div>
        <div class="sub-tab" data-folk="heart" onclick="switchFolk('heart')">心惊</div>
      </div>
      <div class="card" id="folkContent"></div>
    </div>

    <!-- 黄历 -->
    <div class="page" id="page-almanac">
      <div class="card">
        <div class="card-title">今日黄历</div>
        <div id="almanacDetail"></div>
      </div>
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="tab-bar">
    <div class="tab-item active" data-tab="0" onclick="switchTab(0)">
      <span class="tab-icon">🏠</span><span class="tab-label">首页</span>
    </div>
    <div class="tab-item" data-tab="1" onclick="switchTab(1)">
      <span class="tab-icon">🔮</span><span class="tab-label">占卜</span>
    </div>
    <div class="tab-item" data-tab="2" onclick="switchTab(2)">
      <span class="tab-icon">👁</span><span class="tab-label">民俗</span>
    </div>
    <div class="tab-item" data-tab="3" onclick="switchTab(3)">
      <span class="tab-icon">📅</span><span class="tab-label">黄历</span>
    </div>
  </div>
</div>

<script>
// ========== 初始化星空 ==========
function initStars(){
  const c = document.getElementById('stars');
  for(let i=0;i<60;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    s.style.width = s.style.height = (Math.random()*2+1)+'px';
    s.style.setProperty('--dur',(Math.random()*3+2)+'s');
    c.appendChild(s);
  }
}
initStars();

// ========== Tab切换 ==========
let currentTab = 0;
function switchTab(n){
  currentTab = n;
  document.querySelectorAll('.page').forEach((p,i)=>p.classList.toggle('active',i===n));
  document.querySelectorAll('.tab-item').forEach((t,i)=>t.classList.toggle('active',i===n));
}

// ========== 占卜子tab切换 ==========
function switchSub(sub){
  document.querySelectorAll('#page-duk .sub-tab').forEach(t=>{
    t.classList.toggle('active', t.dataset.sub===sub);
  });
  document.querySelectorAll('#page-duk .sub-page').forEach(p=>{
    p.style.display = p.id === 'sub-'+sub ? 'block' : 'none';
  });
}

// ========== 民俗预测（玉匣记原版） ==========
const folkData = {
  ear: {
    title: '耳鸣预测',
    data: [
      ['子时(23-1点)','左主女喜，右主男喜'],
      ['丑时(1-3点)','左主喜事，右主失财'],
      ['寅时(3-5点)','左主失物，右主事吉'],
      ['卯时(5-7点)','左主口舌，右主大吉'],
      ['辰时(7-9点)','左主远行，右主吉昌'],
      ['巳时(9-11点)','左主凶事，右主大吉'],
      ['午时(11-13点)','左主凶事，右主大吉'],
      ['未时(13-15点)','左主吉昌，右主小喜'],
      ['申时(15-17点)','左主吉昌，右主失财'],
      ['酉时(17-19点)','左主客至，右主失财'],
      ['戌时(19-21点)','左主素愿，右主聚财'],
      ['亥时(21-23点)','左主贵至，右主孤单']
    ]
  },
  eye: {
    title: '眼跳预测',
    data: [
      ['子时(23-1点)','左主相思，右主大吉'],
      ['丑时(1-3点)','左主忧疑，右主进宝'],
      ['寅时(3-5点)','左主进财，右主心急'],
      ['卯时(5-7点)','左主贵人，右主平安'],
      ['辰时(7-9点)','左主百病，右主吉日'],

  const val = Math.random() > 0.5 ? 2 : 3; // 2=字(背),3=背(字)
  coinYaos.push(val);
  coinCount++;
  
  const el = document.getElementById('coinResult');
  let lines = '';
  for(let i=coinCount-1;i>=0;i--){

function castZiwei(){
  const dateStr = document.getElementById('ziweiBirth').value;
  const hourIdx = parseInt(document.getElementById('ziweiTime').value);
  const gender = document.getElementById('ziweiGender').value;
  
  if(!dateStr) { alert('请选择出生日期'); return; }
  
  const [y,m,d] = dateStr.split('-').map(Number);
  
  try {
    // iztro排盘
    const astrolabe = iztro.bySolar(`${y}-${m}-${d}`, hourIdx, gender);
    
    let html = '<div class="result-box"><div class="highlight" style="margin-bottom:10px">基本信息</div>';
    html += `<div>主星命宫：${astrolabe.palaces[1].majorStars.map(s=>s.name).join('、')||'空宫'}</div>`;
    html += `<div>身宫：${astrolabe.palaces[1].bodyPalace?'是':'否'}</div>`;
    html += `<div>五行局：${astrolabe.fiveElementsClass}</div>`;
    html += `<div>命主：${astrolabe.soul}</div>`;
    html += `<div>身主：${astrolabe.body}</div>`;
    html += '</div>';
    
    // 十二宫网格
    html += '<div class="ziwei-grid">';
    const positions = ['巳','午','未','申','辰',' ',' ','酉','卯',' ',' ','戌','寅','丑','子','亥'];
    astrolabe.palaces.forEach((p,i)=>{
      const stars = [];
      if(p.majorStars) p.majorStars.forEach(s=>stars.push(`<div class="main-star">${s.name}${s.brightness?'('+s.brightness+')':''}</div>`));
      if(p.minorStars) p.minorStars.forEach(s=>stars.push(`<div class="minor-star">${s.name}</div>`));
      html += `<div class="ziwei-palace ${p.isBodyPalace?'has-zhu':''}">
        <div class="palace-name">${p.heavenlyStem}${p.earthlyBranch} ${p.name}</div>
        ${stars.join('')}
      </div>`;
    });
    html += '</div>';
    
    document.getElementById('ziweiResult').innerHTML = html;
  } catch(e) {
    document.getElementById('ziweiResult').innerHTML = 
      `<div class="result-box" style="color:#e88">排盘出错：${e.message}</div>`;
  }
}

// ========== 梅花易数（完整算法） ==========
function castMeihua(){
  const n1 = parseInt(document.getElementById('meiNum1').value);
  const n2 = parseInt(document.getElementById('meiNum2').value);
  if(!n1 || !n2) { alert('请输入两个数'); return; }
  
  const guaMap = {1:'乾',2:'兑',3:'离',4:'震',5:'巽',6:'坎',7:'艮',8:'坤'};
  const wuxingMap = {1:'金',2:'金',3:'火',4:'木',5:'木',6:'水',7:'土',8:'土'};
  
  const upper = n1 % 8 || 8;
  const lower = n2 % 8 || 8;
  const dong = (n1 + n2) % 6 || 6;
  
  // 本卦
  const benGua = guaMap[upper] + '上' + guaMap[lower] + '下';
  
  // 互卦（2-4爻为下互，3-5爻为上互）

  const today = new Date();
  const lunar = Lunar.fromDate(today);
  
  document.getElementById('meihuaResult').innerHTML = `

          <div style="color:var(--jade-light);font-weight:600">第 ${dong} 爻</div>

        <div style="padding:8px;background:rgba(212,175,55,.1);border-radius:6px">
          <div style="color:var(--text-muted);font-size:10px">下卦</div>
          <div style="color:var(--gold-light);font-weight:600">${guaMap[lower]} (${wuxingMap[lower]})</div>

    '小吉':{desc:'人喜时，属水六合。凡谋事一、五、七，贵人西南，冲羊。五行属水，方位北方，颜色黑色。',
      jie:'小吉最吉昌，路上好商量，阴人来报喜，失物在坤方。行人立便至，交易甚是强。凡事皆和合，病者祈上苍。'},
    '空亡':{desc:'音信时，属土勾陈。凡谋事五、八、十，贵人东北，冲龙。五行属土，方位中央，颜色黄色。',
      jie:'空亡事不祥，阴人多乖张，求财无利益，行人有灾殃。失物寻不见，官事有刑伤。病人逢暗鬼，解禳保平安。'}
  };
  
  let pos = (month - 1) % 6;
  pos = (pos + day - 1) % 6;
  pos = (pos + hour) % 6;
  
  const name = positions[pos];
  const r = results[name];
  
  document.getElementById('xlrResult').innerHTML = `
    <div class="result-box" style="text-align:center">
      <div style="font-size:22px;color:var(--gold-light);font-weight:700;margin:10px 0">${name}</div>
      <div style="text-align:left;margin-top:12px;font-size:12px">
        <div style="color:var(--jade);margin-bottom:6px">【断曰】</div>
        <div style="margin-bottom:10px">${r.jie}</div>
        <div style="color:var(--text-muted)">${r.desc}</div>
      </div>
    </div>`;
}
</script>
