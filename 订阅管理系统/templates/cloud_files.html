<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>常用文件 - 订阅管理系统</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f8fafc; min-height: 100vh; padding: 0; margin: 0;
        }
        .page-header {
            background: linear-gradient(135deg, #1a1a2e, #0f3460);
            color: #fff; padding: 20px 32px;
        }
        .page-header h2 { margin: 0; font-size: 20px; font-weight: 700; }
        .page-header p { margin: 4px 0 0; font-size: 13px; color: rgba(255,255,255,0.55); }
        .page-content { max-width: 900px; margin: 0 auto; padding: 24px; }
        .upload-card {
            background: #fff; border-radius: 12px; padding: 24px;
            border: 2px dashed #e2e8f0; text-align: center; margin-bottom: 24px;
            cursor: pointer; transition: all 0.2s;
        }
        .upload-card:hover { border-color: #10b981; background: #f0fdf4; }
        .upload-card i { font-size: 36px; color: #94a3b8; }
        .upload-card h5 { font-size: 15px; color: #1e293b; margin: 8px 0 4px; }
        .upload-card p { font-size: 13px; color: #94a3b8; margin: 0; }
        .file-list { background: #fff; border-radius: 12px; overflow: hidden; }
        .file-item {
            display: flex; align-items: center; padding: 14px 20px;
            border-bottom: 1px solid #f1f5f9; transition: background 0.1s;
        }
        .file-item:hover { background: #f8fafc; }
        .file-item:last-child { border-bottom: none; }
        .file-icon { font-size: 24px; margin-right: 14px; color: #64748b; }
        .file-info { flex: 1; }
        .file-info .name { font-size: 14px; font-weight: 600; color: #1e293b; }
        .file-info .meta { font-size: 12px; color: #94a3b8; margin-top: 2px; }
        .file-actions { display: flex; gap: 8px; }
        .btn-sm { padding: 4px 12px; font-size: 12px; border-radius: 6px; }
        .empty-state { text-align: center; padding: 48px 20px; color: #94a3b8; }
        .empty-state i { font-size: 48px; display: block; margin-bottom: 12px; }
        .toast-container { z-index: 9999; }
    </style>
</head>
<body>
<div class="page-header">
    <h2><i class="bi bi-cloud me-2"></i>云端常用文件</h2>
    <p>文件存储于云端服务器，仅自己可见</p>
</div>
<div class="page-content">
    <div class="upload-card" id="uploadCard" onclick="document.getElementById('fileInput').click()">
        <i class="bi bi-cloud-arrow-up"></i>
        <h5>点击上传文件到云端</h5>
        <p>支持任意格式文件</p>
        <input type="file" id="fileInput" style="display:none" onchange="uploadFile(this)">
    </div>
    <div class="file-list" id="fileList">
        <div class="empty-state">
            <i class="bi bi-folder-open"></i>
            <p>暂无文件</p>
        </div>
    </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast" class="toast" role="alert">
        <div class="d-flex">
            <div class="toast-body" id="toastMsg"></div>
            <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script>
const TOKEN = new URLSearchParams(window.location.search).get('token');

function showToast(msg, type) {
    const el = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    el.className = 'toast text-bg-' + (type || 'success');
    bootstrap.Toast.getOrCreateInstance(el).show();
}

async function api(url, method, body) {
    const opts = { method, headers: {} };
    if (TOKEN) opts.headers['Authorization'] = 'Bearer ' + TOKEN;
    if (body) opts.body = body;
    const res = await fetch(url, opts);
    return res.json();
}

async function loadFiles() {
    const el = document.getElementById('fileList');
    const data = await api('/api/files/list', 'GET');
    if (!data.success || !data.files || data.files.length === 0) {
        el.innerHTML = '<div class="empty-state"><i class="bi bi-folder-open"></i><p>暂无文件</p></div>';
        return;
    }
    el.innerHTML = data.files.map(f => {
        const ext = f.filename.split('.').pop().toLowerCase();
        const iconMap = {pdf:'bi-file-pdf text-danger', doc:'bi-file-word text-primary', docx:'bi-file-word text-primary', xls:'bi-file-excel text-success', xlsx:'bi-file-excel text-success', png:'bi-file-image text-info', jpg:'bi-file-image text-info', jpeg:'bi-file-image text-info', gif:'bi-file-image text-info', zip:'bi-file-zip text-warning', rar:'bi-file-zip text-warning'};
        const icon = iconMap[ext] || 'bi-file-text text-secondary';
        const size = f.file_size > 1024*1024 ? (f.file_size/1024/1024).toFixed(1)+'MB' : f.file_size > 1024 ? (f.file_size/1024).toFixed(1)+'KB' : f.file_size+'B';
        return '<div class="file-item">' +
            '<i class="bi ' + icon + ' file-icon"></i>' +
            '<div class="file-info"><div class="name">' + f.filename + '</div><div class="meta">' + size + ' · ' + f.upload_time + '</div></div>' +
            '<div class="file-actions">' +
            '<a href="/api/files/download/' + f.id + '?token=' + TOKEN + '" class="btn btn-outline-primary btn-sm"><i class="bi bi-download"></i> 下载</a>' +
            '<button class="btn btn-outline-danger btn-sm" onclick="deleteFile(' + f.id + ')"><i class="bi bi-trash"></i></button>' +
            '</div></div>';
    }).join('');
}

async function uploadFile(input) {
    const file = input.files[0];
    if (!file) return;
    const formData = new FormData();
    formData.append('file', file);
    const data = await api('/api/files/upload', 'POST', formData);
    if (data.success) {
        showToast('上传成功', 'success');
        loadFiles();
    } else {
        showToast(data.message || '上传失败', 'danger');
    }
    input.value = '';
}

async function deleteFile(id) {
    if (!confirm('确定删除此文件？')) return;
    const data = await api('/api/files/delete/' + id, 'POST');
    if (data.success) {
        showToast('删除成功', 'success');
        loadFiles();
    } else {
        showToast(data.message || '删除失败', 'danger');
    }
}

loadFiles();
</script>
<script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
