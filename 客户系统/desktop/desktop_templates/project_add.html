{% extends "base_desktop.html" %}

{% block title %}新增项目{% endblock %}

{% block content %}
<div class="container mt-5 py-4">
    <div class="row justify-content-center">
        <div class="col-lg-10 col-xl-8">
            <div class="card form-card">
                <div class="card-header">
                    <h5 class="mb-0"><i class="bi bi-plus-square text-primary"></i> 新增项目信息</h5>
                    <small class="text-muted">带 * 号为必填项，其他字段支持容缺填写。文件上传请在项目详情页进行。</small>
                </div>
                <div class="card-body p-4">
                    <form method="post" action="/project/add">
                        <div class="row g-4">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="start_date" class="form-label">项目开始时间</label>
                                    <input type="date" name="start_date" class="form-control" id="start_date">
                                </div>
                                <div class="mb-3">
                                    <label for="name" class="form-label required">项目名称</label>
                                    <input type="text" name="name" class="form-control" id="name" placeholder="请输入项目全称" required>
                                </div>
                                <div class="mb-3">
                                    <label for="location" class="form-label">项目所在地</label>
                                    <input type="text" name="location" class="form-control" id="location" placeholder="输入到县级XX市XX县">
                                    <small class="text-muted">请输入项目所在地，如：省份+城市</small>
                                </div>
                                <div class="mb-3">
                                    <label for="owner" class="form-label">业主单位</label>
                                    <input type="text" name="owner" class="form-control" id="owner" placeholder="请输入业主单位名称">
                                </div>
                                <div class="mb-3">
                                    <label for="total_investment" class="form-label">总投资（万元）</label>
                                    <input type="number" name="total_investment" class="form-control" id="total_investment" placeholder="0.00" step="0.01">
                                </div>
                                <div class="mb-3">
                                    <label for="service_content" class="form-label">服务内容</label>
                                    <textarea name="service_content" class="form-control" id="service_content" rows="3" placeholder="请输入项目建议书等（每项服务内容单独新建项目）"></textarea>
                                </div>
                                <div class="mb-3">
                                    <label for="contract_amount" class="form-label">合同金额（万元）</label>
                                    <input type="number" name="contract_amount" class="form-control" id="contract_amount" placeholder="0.00" step="0.01">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="contract_status" class="form-label">合同情况</label>
                                    <select name="contract_status" class="form-select" id="contract_status">
                                        <option value="">请选择</option>
                                        <option value="已签订">已签订</option>
                                        <option value="未签订">未签订</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="invoice_status" class="form-label">开票情况</label>
                                    <select name="invoice_status" class="form-select" id="invoice_status">
                                        <option value="">请选择</option>
                                        <option value="已开票">已开票</option>
                                        <option value="未开票">未开票</option>
                                        <option value="部分开票">部分开票</option>
                                    </select>
                                </div>
                                <div class="mb-3 conditional-field" id="invoiced_amount_group" style="display:none;">
                                    <label for="invoiced_amount" class="form-label">已开票金额（万元）</label>
                                    <input type="number" name="invoiced_amount" class="form-control" id="invoiced_amount" placeholder="0.00" step="0.01">
                                </div>
                                <div class="mb-3">
                                    <label for="payment_status" class="form-label">结款情况</label>
                                    <select name="payment_status" class="form-select" id="payment_status">
                                        <option value="">请选择</option>
                                        <option value="已结款">已结款</option>
                                        <option value="未结款">未结款</option>
                                        <option value="部分结清">部分结清</option>
                                    </select>
                                </div>
                                <div class="mb-3 conditional-field" id="settled_amount_group" style="display:none;">
                                    <label for="settled_amount" class="form-label">已结清金额（万元）</label>
                                    <input type="number" name="settled_amount" class="form-control" id="settled_amount" placeholder="0.00" step="0.01">
                                </div>
                                <div class="mb-3">
                                    <label for="payment_settlement_status" class="form-label">结算提成</label>
                                    <select name="payment_settlement_status" class="form-select" id="payment_settlement_status">
                                        <option value="未结提成" selected>未结提成</option>
                                        <option value="已结提成">已结提成</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="source" class="form-label">来源</label>
                                    <input type="text" name="source" class="form-control" id="source" placeholder="如：李路敏等">
                                </div>
                                <div class="mb-3">
                                    <label for="owner_name" class="form-label">业主姓名</label>
                                    <input type="text" name="owner_name" class="form-control" id="owner_name" placeholder="请输入业主联系人姓名">
                                </div>
                                <div class="mb-3">
                                    <label for="owner_phone" class="form-label">业主电话</label>
                                    <input type="tel" name="owner_phone" class="form-control" id="owner_phone" placeholder="请输入业主联系电话">
                                </div>
                                <div class="mb-3">
                                    <label for="remark" class="form-label">备注</label>
                                    <textarea name="remark" class="form-control" id="remark" rows="3" placeholder="请输入其他需要说明的信息"></textarea>
                                </div>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between mt-4">
                            <a href="/" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> 取消返回</a>
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> 保存项目</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    document.getElementById('start_date').value = new Date().toISOString().split('T')[0];

    // 条件显示：开票情况 -> 已开票金额
    const invoiceSelect = document.getElementById('invoice_status');
    const invoicedGroup = document.getElementById('invoiced_amount_group');
    if (invoiceSelect && invoicedGroup) {
        function toggleInvoiced() {
            invoicedGroup.style.display = invoiceSelect.value === '部分开票' ? 'block' : 'none';
        }
        invoiceSelect.addEventListener('change', toggleInvoiced);
    }

    // 条件显示：结款情况 -> 已结清金额
    const paymentSelect = document.getElementById('payment_status');
    const settledGroup = document.getElementById('settled_amount_group');
    if (paymentSelect && settledGroup) {
        function toggleSettled() {
            settledGroup.style.display = paymentSelect.value === '部分结清' ? 'block' : 'none';
        }
        paymentSelect.addEventListener('change', toggleSettled);
    }

    document.querySelector('form').addEventListener('submit', function(e) {
        const nameInput = document.getElementById('name');
        if (!nameInput.value.trim()) {
            e.preventDefault();
            alert('项目名称是必填项，请填写项目名称！');
            nameInput.focus();
            return false;
        }
        const investmentInput = document.getElementById('total_investment');
        if (investmentInput.value && parseFloat(investmentInput.value) < 0) {
            e.preventDefault();
            alert('投资金额不能为负数！');
            investmentInput.focus();
            return false;
        }
        const contractAmountInput = document.getElementById('contract_amount');
        if (contractAmountInput.value && parseFloat(contractAmountInput.value) < 0) {
            e.preventDefault();
            alert('合同金额不能为负数！');
            contractAmountInput.focus();
            return false;
        }
        return true;
    });
</script>
{% endblock %}
