<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>登录确认 - 项目管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            padding: 32px 24px;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .card .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .card h1 {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 4px;
        }
        .card p { font-size: 14px; color: #6c757d; margin-bottom: 20px; }
        .card .code-display {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 8px;
            color: #0f3460;
            background: #f0f4ff;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 14px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #495057;
            margin-bottom: 4px;
        }
        .form-group input {
            width: 100%;
            height: 44px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 0 14px;
            font-size: 15px;
            transition: border-color 0.2s;
            outline: none;
        }
        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        .btn {
            display: block;
            width: 100%;
            height: 44px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            margin-top: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102,126,234,0.3);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-outline {
            background: #fff;
            color: #6c757d;
            border: 2px solid #e9ecef;
        }
        .btn-outline:hover { background: #f8f9fa; }
        .status-msg {
            margin-top: 12px;
            font-size: 14px;
            min-height: 20px;
        }
        .status-msg.success { color: #198754; }
        .status-msg.error { color: #dc3545; }
        .status-msg.loading { color: #0d6efd; }
        .step { display: none; }
        .step.active { display: block; }
        .divider {
            margin: 16px 0;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #adb5bd;
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e9ecef;
        }
        .phone-confirm {
            background: #f0faff;
            border: 1px solid #b6d4fe;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .phone-confirm .user-name {
            font-size: 18px;
            font-weight: 700;
            color: #0f3460;
        }
        .phone-confirm p {
            font-size: 13px;
            color: #6c757d;
            margin: 4px 0 0;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="card">
    <!-- Step 0: 加载中 -->
    <div class="step active" id="step-loading">
        <div class="icon">⏳</div>
        <h1>验证中...</h1>
        <p>正在验证配对信息</p>
        <div class="status-msg loading">请稍候</div>
    </div>

    <!-- Step 1: 首次使用 - 注册/登录 -->
    <div class="step" id="step-login">
        <div class="icon">🔐</div>
        <h1>登录确认</h1>
        <p>输入你的账号信息，确认登录桌面端</p>
        <div class="code-display" id="display-code">------</div>

        <div class="form-group">
            <label>用户名</label>
            <input type="text" id="input-username" placeholder="输入用户名" autocomplete="username">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="input-password" placeholder="输入密码" autocomplete="current-password">
        </div>

        <button class="btn btn-primary" id="btn-confirm">确认登录</button>
        <div class="status-msg" id="login-msg"></div>

        <div class="divider">没有账号？直接注册</div>
        <p style="font-size: 13px; color: #6c757d;">
            输入新的用户名和密码即可自动注册并登录
        </p>
    </div>

    <!-- Step 2: 已记住 - 一键确认 -->
    <div class="step" id="step-autoconfirm">
        <div class="icon">📱</div>
        <h1>确认登录</h1>
        <div class="phone-confirm">
            <div class="user-name" id="auto-username">--</div>
            <p>点击下方按钮，确认登录桌面端</p>
        </div>
        <button class="btn btn-primary" id="btn-autoconfirm">✅ 确认登录</button>
        <button class="btn btn-outline" id="btn-switch-account" style="margin-top:8px">切换账号</button>
        <div class="status-msg" id="autoconfirm-msg"></div>
    </div>

    <!-- Step 3: 配对成功 -->
    <div class="step" id="step-success">
        <div class="icon">✅</div>
        <h1>配对成功！</h1>
        <p>桌面端已自动登录，请返回桌面端继续使用</p>
        <div class="phone-confirm">
            <div style="font-size: 14px; color: #495057;">欢迎回来</div>
            <div class="user-name" id="success-username">--</div>
        </div>
        <p style="font-size: 12px; color: #adb5bd; margin-top: 12px;">关闭此页面即可</p>
    </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const code = params.get('code');

// ====== 自动确认流程 ======
// 先检查 localStorage 有没有 phone_token
let phoneToken = localStorage.getItem('phone_token');
let currentStep = 'loading';

function showStep(stepId) {
    document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
    document.getElementById(stepId).classList.add('active');
    currentStep = stepId;
}

function setMsg(elId, text, type) {
    const el = document.getElementById(elId);
    el.textContent = text;
    el.className = 'status-msg ' + (type || '');
}

// 如果有 phone_token, 先尝试自动确认
if (code) {
    document.getElementById('display-code').textContent = code;

    if (phoneToken) {
        showStep('step-autoconfirm');
        // 通过 phone_token 获取用户信息
        fetch('/api/pair/confirm', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({code: code, phone_token: phoneToken})
        })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                document.getElementById('auto-username').textContent = data.username;
            } else {
                // phone_token 失效，退到登录页
                phoneToken = null;
                localStorage.removeItem('phone_token');
                showStep('step-login');
            }
        })
        .catch(() => {
            showStep('step-login');
        });
    } else {
        showStep('step-login');
    }
} else {
    document.getElementById('step-loading').querySelector('p').textContent = '无效的配对链接';
}

// 确认登录按钮
document.getElementById('btn-confirm').addEventListener('click', function() {
    const username = document.getElementById('input-username').value.trim();
    const password = document.getElementById('input-password').value.trim();
    if (!username || !password) {
        setMsg('login-msg', '请输入用户名和密码', 'error');
        return;
    }

    const btn = this;
    btn.disabled = true;
    btn.textContent = '处理中...';
    setMsg('login-msg', '正在连接服务器...', 'loading');

    fetch('/api/pair/confirm', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({code: code, username: username, password: password})
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            if (data.phone_token) {
                localStorage.setItem('phone_token', data.phone_token);
            }
            document.getElementById('success-username').textContent = data.username;
            showStep('step-success');
        } else {
            setMsg('login-msg', data.message || '操作失败', 'error');
            btn.disabled = false;
            btn.textContent = '确认登录';
        }
    })
    .catch(err => {
        setMsg('login-msg', '网络错误，请重试', 'error');
        btn.disabled = false;
        btn.textContent = '确认登录';
    });
});

// 自动确认按钮
document.getElementById('btn-autoconfirm').addEventListener('click', function() {
    const btn = this;
    btn.disabled = true;
    btn.textContent = '确认中...';
    setMsg('autoconfirm-msg', '', '');

    fetch('/api/pair/confirm', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({code: code, phone_token: phoneToken})
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            document.getElementById('success-username').textContent = data.username;
            showStep('step-success');
        } else {
            phoneToken = null;
            localStorage.removeItem('phone_token');
            showStep('step-login');
        }
    })
    .catch(() => {
        setMsg('autoconfirm-msg', '网络错误，请重试', 'error');
        btn.disabled = false;
        btn.textContent = '✅ 确认登录';
    });
});

// 切换账号
document.getElementById('btn-switch-account').addEventListener('click', function() {
    phoneToken = null;
    localStorage.removeItem('phone_token');
    showStep('step-login');
});
</script>
</body>
</html>
