<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 河北鑫奥项目管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'DM Sans', sans-serif;
            overflow: hidden;
        }

        /* Geometric pattern background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                linear-gradient(rgba(0, 184, 148, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 184, 148, 0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }

        /* Ambient glow */
        body::after {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 50%, rgba(0, 184, 148, 0.06) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 50%, rgba(139, 116, 224, 0.04) 0%, transparent 50%);
            animation: ambientPulse 8s ease-in-out infinite alternate;
        }

        @keyframes ambientPulse {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .login-container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(30px) saturate(1.5);
            -webkit-backdrop-filter: blur(30px) saturate(1.5);
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 440px;
            padding: 0;
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            padding: 40px 36px 24px;
            text-align: center;
            position: relative;
        }

        .login-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 36px;
            right: 36px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 184, 148, 0.3), transparent);
        }

        .logo-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(0, 184, 148, 0.12), rgba(139, 116, 224, 0.12));
            border: 1px solid rgba(0, 184, 148, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 1.6rem;
            color: #00b894;
            animation: logoGlow 3s ease-in-out infinite alternate;
        }

        @keyframes logoGlow {
            from { box-shadow: 0 0 20px rgba(0, 184, 148, 0.08); }
            to { box-shadow: 0 0 30px rgba(0, 184, 148, 0.18); }
        }

        .login-header h1 {
            font-family: 'Sora', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a2332;
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }

        .login-header p {
            color: #5a6b7a;
            font-size: 0.9rem;
        }

        .login-body {
            padding: 32px 36px 40px;
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #5a6b7a;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: #f0f4f8;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 10px;
            font-size: 0.95rem;
            color: #1a2332;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input::placeholder {
            color: #9aa8b8;
        }

        .input-group input:focus {
            border-color: #00b894;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 184, 148, 0.12), 0 0 20px rgba(0, 184, 148, 0.08);
        }

        .login-btn {
            background: linear-gradient(135deg, #00b894, #009d7a);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: 'Sora', sans-serif;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.02em;
        }

        .login-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s ease;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #00d4aa, #00b894);
            box-shadow: 0 6px 25px rgba(0, 184, 148, 0.35);
            transform: translateY(-1px);
        }

        .login-btn:hover::after {
            transform: translateX(100%);
        }

        .message {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .error {
            background: rgba(229, 85, 85, 0.1);
            color: #e55555;
            border: 1px solid rgba(229, 85, 85, 0.2);
        }

        .success {
            background: rgba(0, 184, 148, 0.1);
            color: #00b894;
            border: 1px solid rgba(0, 184, 148, 0.2);
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            color: #9aa8b8;
            font-size: 0.82rem;
        }

        .footer a {
            color: #00b894;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Mobile responsive */
        @media (max-width: 480px) {
            .login-container {
                max-width: 92%;
                border-radius: 16px;
            }

            .login-header {
                padding: 32px 24px 20px;
            }

            .login-header h1 {
                font-size: 1.25rem;
            }

            .login-body {
                padding: 24px 24px 32px;
            }

            .logo-icon {
                width: 48px;
                height: 48px;
                font-size: 1.3rem;
            }

            .input-group input {
                font-size: 16px !important;
                padding: 14px 16px;
            }

            .login-btn {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo-icon">
                <i class="bi bi-building"></i>
            </div>
            <h1>河北鑫奥项目管理系统</h1>
            <p>欢迎回来，请登录您的账户</p>
        </div>

        <div class="login-body">
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="message error">
                        {{ messages[0] }}
                    </div>
                {% endif %}
            {% endwith %}

            <form method="post" action="/login">
                <div class="input-group">
                    <label for="name">用户名</label>
                    <input type="text" id="name" name="name" placeholder="请输入用户名" required autofocus>
                </div>

                <div class="input-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" placeholder="请输入密码" required>
                </div>

                <button type="submit" class="login-btn">登录系统</button>
            </form>

            <div class="footer">
                <p>工程师账户请联系管理员获取</p>
            </div>
        </div>
    </div>
</body>
</html>
